{{- if and .Values.models.ltx25.enabled .Values.hf.token }}
{{- /* Inline HF token (lab convenience). Prefer hf.existingSecret instead. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "comfyui-video-lab.fullname" . }}-hf
  labels:
    {{- include "comfyui-video-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.hf.token | quote }}
{{- end }}
