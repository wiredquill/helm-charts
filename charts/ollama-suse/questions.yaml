# questions.yaml for charts/ollama-suse
# Built from the base template at docs/questions-template/questions.yaml.
# See docs/questions-template/README.md for schema conventions.
#
# Nesting reminder (see charts/ollama-suse/values.yaml for the authoritative
# shape): ollama.service.*, ollama.resources.*, ollama.persistentVolume.*,
# ollama.ingress.*, ollama.global.*, ollama.extraEnv, ollama.priorityClassName
# sit ONE level under ollama.* (the dependency alias). ollama.ollama.* is TWO
# levels down because the vendored SUSE ollama subchart nests port/gpu/models
# under its OWN internal `ollama:` key.

questions:

# ===========================================================================
# TAB 1: Quick Start (renders first — Rancher orders tabs by first
# occurrence in this file)
# ===========================================================================
# Model and Service Type/LoadBalancer IP below are intentionally duplicated
# verbatim later in the file under their proper dedicated tab (Networking)
# — see docs/questions-template/README.md, "The 'duplicate variable across
# two tabs' idiom". Keep both copies of each field byte-for-byte identical
# (default/type/options/description) if you edit one. GPU (Enable/Type/
# Count) and Secondary Model / Preload Model Into Memory, by contrast, exist
# ONLY here — there's no separate GPU Configuration or Model Configuration
# tab.

- variable: ollama.ollama.models.pull[0]
  label: "Model"
  description: "Primary Ollama model to pull and serve on startup (e.g. 'llama3.2:latest', 'tinyllama:latest', 'gemma2:9b')."
  type: "string"
  default: "llama3.2:latest"
  group: "Quick Start"
  required: true

- variable: ollama.ollama.gpu.enabled
  label: "Enable GPU"
  description: "Enable GPU support for Ollama (NVIDIA or AMD GPU required on the target node)."
  type: "boolean"
  default: true
  group: "Quick Start"

- variable: ollama.ollama.gpu.type
  label: "GPU Type"
  description: "GPU vendor to request resources from."
  type: "enum"
  options:
    - "nvidia"
    - "amd"
  default: "nvidia"
  show_if: "ollama.ollama.gpu.enabled=true"
  group: "Quick Start"

- variable: ollama.ollama.gpu.number
  label: "GPU Count"
  description: "Number of GPUs to allocate."
  type: "int"
  min: 1
  max: 8
  default: 1
  show_if: "ollama.ollama.gpu.enabled=true"
  group: "Quick Start"

- variable: ollama.service.type
  label: "Service Type"
  description: "Kubernetes service type for accessing Ollama."
  type: "enum"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"
  default: "ClusterIP"
  group: "Quick Start"

- variable: ollama.service.nodePort
  label: "Node Port"
  description: "Static port (30000-32767) to expose on every node. Only used when Service Type is NodePort."
  type: "int"
  min: 30000
  max: 32767
  default: 31434
  show_if: "ollama.service.type=NodePort"
  group: "Quick Start"

- variable: ollama.service.loadBalancerIP
  label: "Load Balancer IP"
  description: "Static IP address to assign to the LoadBalancer. Leave empty for automatic assignment."
  type: "string"
  default: ""
  show_if: "ollama.service.type=LoadBalancer"
  group: "Quick Start"

# Basic/Advanced toggle: when left unchecked, every field below tagged
# `show_if: "...ollama.showAdvanced=true..."` is hidden, and any TAB whose
# every field carries that condition (currently just Advanced) is hidden
# from the sidebar entirely — Rancher collapses a tab once all of its
# questions evaluate to hidden. See docs/questions-template/README.md,
# "Basic/Advanced toggle (tab-level show_if)".
- variable: ollama.showAdvanced
  label: "Show Advanced Options"
  description: "Reveals less-common settings (image pull policy/pull secret, secondary models, and the Advanced tab) across every tab below. Leave unchecked for a minimal, guided setup. Observability, Ingress, Image Tag, and Storage Class stay visible regardless — none of those are considered advanced."
  type: "boolean"
  default: false
  group: "Quick Start"

# There is no separate "Model Configuration" tab — Primary Model above is
# the only model field visible by default; these two reveal only once Show
# Advanced Options is checked. (`ollama.ollama.models` is an object with
# list-valued `pull`/`run` fields in values.yaml, not a flat list — these
# index into `models.pull[1]`/`models.run[0]` accordingly.)
- variable: ollama.ollama.models.pull[1]
  label: "Secondary Model"
  description: "Optional second model to pull on startup. Leave empty to skip."
  type: "string"
  default: ""
  show_if: "ollama.showAdvanced=true"
  group: "Quick Start"

- variable: ollama.ollama.models.run[0]
  label: "Preload Model Into Memory"
  description: "Optional: a model name to keep loaded in memory at startup (avoids a cold-start delay on first request). Usually the same as Primary Model above. Leave empty to load models on-demand only."
  type: "string"
  default: ""
  show_if: "ollama.showAdvanced=true"
  group: "Quick Start"

# ===========================================================================
# TAB 2: Image
# ===========================================================================
- variable: ollama.image.repository
  label: "Image Repository"
  description: "Container image repository for Ollama (SUSE Application Collection)."
  type: "string"
  default: "registry.suse.com/bci/ollama"
  group: "Image"
  required: true

- variable: ollama.image.tag
  label: "Image Tag"
  description: "Ollama image tag to deploy."
  type: "string"
  default: "0.21.2"
  group: "Image"

- variable: ollama.image.pullPolicy
  label: "Image Pull Policy"
  description: "When to pull the Ollama image."
  type: "enum"
  options:
    - "IfNotPresent"
    - "Always"
    - "Never"
  default: "IfNotPresent"
  show_if: "ollama.showAdvanced=true"
  group: "Image"

# GOTCHA: do NOT bind a plain `type: string` field straight to
# `ollama.imagePullSecrets` — the vendored subchart's _helpers.tpl expects
# the non-global `imagePullSecrets` to already be a list of {name: ...} maps
# (it does a bare `toYaml`), while `global.imagePullSecrets` explicitly
# converts each plain string entry into {name: <string>}. Bind to the global
# passthrough instead so a simple string question works correctly:
- variable: ollama.global.imagePullSecrets[0]
  label: "Image Pull Secret"
  description: "Name of an existing Kubernetes Secret for pulling from a private/authenticated registry. Leave empty if registry.suse.com is reachable without authentication in your environment."
  type: "string"
  default: ""
  show_if: "ollama.showAdvanced=true"
  group: "Image"

# ===========================================================================
# TAB 3: Networking (Service + Ingress, combined per request — the survey of
# this repo found several charts, e.g. ollama-upstream, already pair
# service exposure and ingress under one "Networking" tab)
# ===========================================================================
- variable: ollama.service.type
  label: "Service Type"
  description: "Kubernetes service type for accessing Ollama."
  type: "enum"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"
  default: "ClusterIP"
  group: "Networking"

- variable: ollama.service.nodePort
  label: "Node Port"
  description: "Static port (30000-32767) to expose on every node. Only used when Service Type is NodePort."
  type: "int"
  min: 30000
  max: 32767
  default: 31434
  show_if: "ollama.service.type=NodePort"
  group: "Networking"

- variable: ollama.service.loadBalancerIP
  label: "Load Balancer IP"
  description: "Static IP address to assign to the LoadBalancer. Leave empty for automatic assignment."
  type: "string"
  default: ""
  show_if: "ollama.service.type=LoadBalancer"
  group: "Networking"

- variable: ollama.ingress.enabled
  label: "Enable Ingress"
  description: "Expose Ollama via a Kubernetes Ingress resource."
  type: "boolean"
  default: false
  group: "Networking"

- variable: ollama.ingress.className
  label: "Ingress Class"
  description: "IngressClass to use (e.g. 'nginx', 'traefik'). Leave empty to use the cluster default."
  type: "string"
  default: ""
  show_if: "ollama.ingress.enabled=true"
  group: "Networking"

# NOTE: the vendored ollama chart's ingress.yaml ranges over
# .Values.ingress.hosts (a LIST of {host, paths[]} objects), not a flat
# ingress.host string — confirmed by reading
# charts/ollama-suse/charts/ollama/templates/ingress.yaml directly.
- variable: ollama.ingress.hosts[0].host
  label: "Ingress Hostname"
  description: "Hostname to route to this Ollama instance (e.g. 'ollama.example.com')."
  type: "hostname"
  default: ""
  show_if: "ollama.ingress.enabled=true"
  group: "Networking"
  required: true

# ===========================================================================
# TAB 4: Resource Configuration (CPU/memory sizing only — GPU config lives
# entirely on Quick Start now, not duplicated here)
# ===========================================================================
- variable: ollama.resources.requests.memory
  label: "Memory Request"
  description: "Memory request for Ollama (enterprise sizing)."
  type: "string"
  default: "4Gi"
  group: "Resource Configuration"

- variable: ollama.resources.requests.cpu
  label: "CPU Request"
  description: "CPU request for Ollama (enterprise sizing)."
  type: "string"
  default: "2000m"
  group: "Resource Configuration"

- variable: ollama.resources.limits.memory
  label: "Memory Limit"
  description: "Memory limit for Ollama (enterprise sizing)."
  type: "string"
  default: "16Gi"
  group: "Resource Configuration"

- variable: ollama.resources.limits.cpu
  label: "CPU Limit"
  description: "CPU limit for Ollama (enterprise sizing)."
  type: "string"
  default: "8000m"
  group: "Resource Configuration"

# ===========================================================================
# TAB 5: Storage Configuration
# ===========================================================================
- variable: ollama.persistentVolume.enabled
  label: "Enable Persistence"
  description: "Enable persistent storage for models."
  type: "boolean"
  default: true
  group: "Storage Configuration"

- variable: ollama.persistentVolume.size
  label: "Storage Size"
  description: "Size of persistent volume for models."
  type: "string"
  default: "100Gi"
  show_if: "ollama.persistentVolume.enabled=true"
  group: "Storage Configuration"

- variable: ollama.persistentVolume.storageClass
  label: "Storage Class"
  description: "Storage class for persistent volume."
  type: "storageclass"
  default: "suse-csi"
  show_if: "ollama.persistentVolume.enabled=true"
  group: "Storage Configuration"

# ===========================================================================
# TAB 6: Observability — always visible, NOT gated behind the Advanced
# toggle. SUSE AI Factory deployments are expected to have OpenTelemetry
# wired in by default, so this tab stays on the front page of tabs
# regardless of Show Advanced Options.
# ===========================================================================
# SIMPLE pattern (matches the SUSE AI Factory hr-assistant demo app's
# OpenTelemetry setup). CAVEAT: the vendored `ollama` chart has no built-in
# OTel exporter and no native GPU-stats knob, and charts/ollama-suse/templates/
# contains only NOTES.txt + _helpers.tpl (no deployment of its own to add
# translation logic to). These two fields are therefore wired directly into
# the subchart's existing, already-functional `extraEnv` passthrough as real
# environment variables on the Ollama container — they render into the pod
# spec correctly, but are not consumed by the `ollama` binary today. They
# exist to (a) match this repo's standard Observability tab for UI/UX
# consistency across charts, and (b) be immediately available to any future
# sidecar/exporter that reads standard OTel env vars. Wiring up an actual
# metrics/tracing pipeline for Ollama would require either an updated image
# with built-in OTel support or a separately-deployed OTel Collector
# scraping Ollama/GPU exporters — both out of scope for this questions.yaml.
#
# The endpoint URL follows a fixed, predictable convention rather than being
# arbitrary: SUSE AI Factory's OpenTelemetry Collector Helm release is always
# reachable at the service name `opentelemetry-collector` on port 4318, in
# whatever namespace it was installed into — this is exactly what
# hr-assistant's own live deployment uses
# (http://opentelemetry-collector.observability.svc.cluster.local:4318, per
# its current-deployment.yaml). So in practice the ONLY thing that varies
# between clusters is the namespace segment; you don't need to know the pod
# name, service port, or anything else about how SUSE Observability was
# deployed — just which namespace it landed in (commonly "observability",
# the default below).
- variable: ollama.extraEnv[0].value
  label: "OTLP Endpoint"
  description: "OpenTelemetry collector endpoint. Follows the standard SUSE AI Factory convention http://opentelemetry-collector.<namespace>.svc.cluster.local:4318 — if your cluster's OTel Collector isn't in the 'observability' namespace, replace just that segment with the right one; everything else about this URL is fixed. NOTE: the stock Ollama binary does not natively export OTel telemetry — this sets the OTEL_EXPORTER_OTLP_ENDPOINT env var for future use by an exporter sidecar or an updated image."
  type: "string"
  default: "http://opentelemetry-collector.observability.svc.cluster.local:4318"
  group: "Observability"

# Deliberately `type: enum` with string options, NOT `type: boolean`: a
# native YAML boolean written into extraEnv[].value would serialize as an
# unquoted true/false, which the Kubernetes API rejects (EnvVar.value is a
# Go string field — "cannot unmarshal bool into Go struct field
# EnvVar.value of type string"). Using enum guarantees a quoted string.
- variable: ollama.extraEnv[1].value
  label: "Collect GPU Stats"
  description: "Whether to emit GPU utilization/memory metrics via the OLLAMA_COLLECT_GPU_STATS env var. See tab description above — not yet consumed by the stock Ollama image."
  type: "enum"
  options:
    - "false"
    - "true"
  default: "false"
  group: "Observability"

# ===========================================================================
# TAB 7: Advanced — also entirely gated behind the toggle, same mechanism.
# ===========================================================================
- variable: ollama.priorityClassName
  label: "Priority Class Name"
  description: "Kubernetes PriorityClass to assign to the Ollama pod. Leave empty to use the cluster default."
  type: "string"
  default: ""
  show_if: "ollama.showAdvanced=true"
  group: "Advanced"

# NOTE: nodeSelector/tolerations are deliberately NOT exposed here. The
# vendored subchart renders `tolerations:` whenever `.Values.tolerations` is
# a non-empty list (no separate enable flag), so a form-friendly single-entry
# default risks shipping a Kubernetes wildcard toleration or an
# unschedulable nodeSelector by default. See
# docs/questions-template/README.md, "Maps and lists" section, for the full
# reasoning. Edit values.yaml directly if you need either of these.
