# Default values for ollama-suse wrapper chart
# This passes through to the SUSE Application Collection ollama chart

# Global SUSE configuration
global:
  cattle:
    systemDefaultRegistry: ""

# All values for the SUSE ollama dependency are nested under the 'ollama' key
# This is required for Helm dependency value passing
ollama:
  # Docker image configuration (SUSE Application Collection)
  image:
    repository: registry.suse.com/bci/ollama
    tag: "0.21.2"
    pullPolicy: IfNotPresent

  # Global passthrough into the vendored subchart. Must stay a list of
  # strings/maps here - the subchart's imagePullSecrets helper converts each
  # string entry into {name: <string>} (see questions.yaml General tab).
  global:
    imagePullSecrets: []

  # Service configuration - at root of dependency values
  service:
    type: ClusterIP
    nodePort: 31434
    loadBalancerIP: ""

  # Enterprise resource configuration - CPU and memory allocations
  # These are merged with GPU resources when gpu.enabled=true
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "16Gi"
      cpu: "8000m"

  # Persistent volume configuration for Ollama data
  persistentVolume:
    enabled: true
    size: "100Gi"
    storageClass: "suse-csi"

  # Ingress configuration, off by default. Made explicit here (rather than
  # relying silently on the vendored subchart's own defaults) so
  # questions.yaml has a documented default to bind to.
  ingress:
    enabled: false
    className: ""
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Observability env vars (see questions.yaml Observability tab for why
  # these are wired via extraEnv rather than a first-class values field -
  # the stock Ollama image doesn't natively consume them yet).
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://opentelemetry-collector.observability.svc.cluster.local:4318"
    - name: OLLAMA_COLLECT_GPU_STATS
      value: "false"

  priorityClassName: ""

  # UI-only: gates the Basic/Advanced toggle in questions.yaml (Quick Start
  # tab). Not consumed by any template - purely controls which fields/tabs
  # the Rancher form shows. Safe to leave false; has no effect on `helm
  # template`/`helm install` output either way.
  showAdvanced: false

  # Ollama-specific configuration (nested under ollama section of upstream chart)
  ollama:
    # Port configuration
    port: 11434

    # GPU configuration - automatically applies to deployment resources
    gpu:
      enabled: true
      type: "nvidia"
      number: 1
      nvidiaResource: "nvidia.com/gpu"

    # Models to pull/run at startup. Primary model seeded to match
    # questions.yaml's "Primary Model" / "Model" question defaults.
    models:
      pull:
        - "llama3.2:latest"
      run: []
