apiVersion: v2
name: rancher-ai-vllm
description: vLLM model serving for SUSE Rancher AI (Liz) with native Prometheus token metrics and full SUSE Observability integration including GenAI topology (wraps the SUSE Application Collection vllm chart)
type: application
version: 0.5.18
appVersion: "0.19.0"
dependencies:
  - name: vllm
    version: 0.1.10
    repository: file://charts/vllm
    alias: vllm
maintainers:
  - name: AI Demos Team
    email: ai-demos@example.com
keywords:
  - rancher-ai
  - vllm
  - llm
  - ai
  - observability
  - suse
annotations:
  category: MachineLearning
  suse.com/registry: "SUSE Application Collection"
  suse.com/enterprise: "true"
