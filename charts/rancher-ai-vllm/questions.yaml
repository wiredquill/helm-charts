questions:
# ===== General =====
- variable: clusterName
  group: "General"
  label: "Cluster Name"
  description: "Cluster identity stamped into OTel resource attributes (k8s.cluster.name). Use the same value you configured in the SUSE Observability collector (e.g. dev-ai, h100-prod)."
  type: "string"
  default: ""

# ===== Model Selection =====
- variable: vllm.servingEngineSpec.modelSpec.main.modelURL
  group: "Model"
  label: "Model (by GPU VRAM class)"
  description: "Choose the model that fits your GPU (Hugging Face model ID). VRAM depends on quantization: 16GB -> Qwen2.5-7B (fp16); 24GB -> Qwen3.6-35B-A3B (AWQ/GPTQ); 64GB -> Qwen3.6-35B-A3B (fp8) or Llama-3.3-70B (AWQ); 100GB -> gpt-oss-120b or Qwen3.6-35B-A3B (bf16)."
  type: "enum"
  default: "Qwen/Qwen3.6-35B-A3B"
  required: true
  options:
    # 16GB class
    - label: "16GB GPU — Qwen/Qwen2.5-7B-Instruct (~16GB fp16)"
      value: "Qwen/Qwen2.5-7B-Instruct"
    # 24GB class
    - label: "24GB GPU — Qwen/Qwen3.6-35B-A3B (AWQ ~19GB)"
      value: "Qwen/Qwen3.6-35B-A3B"
    # 64GB class
    - label: "64GB GPU — Qwen/Qwen3.6-35B-A3B (fp8 ~35GB)"
      value: "Qwen/Qwen3.6-35B-A3B"
    - label: "64GB GPU — meta-llama/Llama-3.3-70B-Instruct (AWQ ~40GB)"
      value: "meta-llama/Llama-3.3-70B-Instruct"
    # 100GB class
    - label: "100GB GPU — openai/gpt-oss-120b (~68GB)"
      value: "openai/gpt-oss-120b"
    - label: "100GB GPU — Qwen/Qwen3.6-35B-A3B (bf16 ~70GB)"
      value: "Qwen/Qwen3.6-35B-A3B"

- variable: vllm.servingEngineSpec.modelSpec.main.name
  group: "Model"
  label: "Model Deployment Name"
  description: "Short name used in resource names (Deployments, Services, PVCs). MUST be DNS-1035 safe: lowercase alphanumerics and dashes only — NO dots, underscores, or spaces (a dot like 'qwen3.6-35b' makes the Service name invalid and helm install fails). e.g. qwen35b, gpt-oss-120b. This is just the Kubernetes resource name; the actual served model comes from the model URL above."
  type: "string"
  default: "qwen35b"
  required: true

# ===== Model Resources =====
- variable: vllm.servingEngineSpec.modelSpec.main.requestGPU
  group: "Model Resources"
  label: "GPU Request (per replica)"
  description: "Number of GPUs the serving engine requests. vLLM keeps the model weights + KV cache in VRAM, so the GPU does the heavy lifting. 1 full GPU per replica unless the model needs tensor parallelism (see GPU limits below)."
  type: "integer"
  default: 1
  required: true

- variable: vllm.servingEngineSpec.modelSpec.main.requestGPUType
  group: "Model Resources"
  label: "GPU Resource Name"
  description: "Kubernetes resource name for the GPU. nvidia.com/gpu for full or time-sliced GPUs; a MIG profile (e.g. nvidia.com/mig-4g.71gb) for MIG partitions on H100/A100. For MIG, also set the GPU memory limit below."
  type: "string"
  default: "nvidia.com/gpu"

- variable: vllm.servingEngineSpec.modelSpec.main.requestCPU
  group: "Model Resources"
  label: "CPU Request (cores)"
  description: "CPU cores requested for the serving engine. The GPU does the matmuls; CPU handles tokenization, scheduling and Python overhead. 2 cores is fine for a small model / test; use 8+ for a 35B model and concurrent load."
  type: "integer"
  default: 8

- variable: vllm.servingEngineSpec.modelSpec.main.limitCPU
  group: "Model Resources"
  label: "CPU Limit (cores)"
  description: "Hard CPU ceiling. Leave equal to the request to avoid throttling surprises. 0 inherits the request."
  type: "integer"
  default: 8

- variable: vllm.servingEngineSpec.modelSpec.main.requestMemory
  group: "Model Resources"
  label: "Memory Request"
  description: "Memory requested for the serving engine. vLLM streams model weights through CPU RAM before moving them to the GPU, so this must comfortably EXCEED the model size: 35B AWQ ~19GB -> 32Gi; 7B fp16 ~16GB -> 24Gi; 70B AWQ ~40GB -> 64Gi."
  type: "string"
  default: "32Gi"

- variable: vllm.servingEngineSpec.modelSpec.main.limitMemory
  group: "Model Resources"
  label: "Memory Limit"
  description: "Hard memory ceiling. Must exceed the model size for the load phase (see Memory Request). A too-low limit OOM-kills the pod during model load. 0 inherits the request."
  type: "string"
  default: "48Gi"

- variable: vllm.servingEngineSpec.modelSpec.main.limitGPUMem
  group: "Model Resources"
  label: "GPU Memory Limit (MIG, MiB)"
  description: "Optional. For MIG-partitioned GPUs (nvidia.com/gpumem), cap VRAM per instance — e.g. 71680 for a 70GB slice. Leave empty on full GPUs; the requestGPU count is the limit there."
  type: "string"
  default: ""

# ===== Storage =====
- variable: vllm.servingEngineSpec.modelSpec.main.pvcStorage
  group: "Storage"
  label: "Model Cache PVC Size"
  description: "vLLM downloads model weights into a PVC so restarts are fast. Set generous size (e.g. 100Gi-500Gi). The shared NFS cache option below can replace this per-instance PVC with one cache shared across deployments."
  type: "string"
  default: "100Gi"

- variable: vllm.servingEngineSpec.modelSpec.main.storageClass
  group: "Storage"
  label: "Storage Class"
  description: "Storage class for the model cache PVC. 'Default' (recommended) uses the cluster's DEFAULT storage class — the safe choice on any cluster. Pick a specific class by name when you need one (harvester on Harvester, longhorn on Rancher/Longhorn, local-path on plain RKE2/k3s). Use a shared RWX class to share one cache across deployments."
  type: "enum"
  default: "Default"
  options:
    - "Default"
    - "harvester"
    - "longhorn"
    - "local-path"

- variable: vllm.sharedPvcStorage.enabled
  group: "Storage"
  label: "Enable Shared NFS Model Cache (skip re-downloads)"
  description: "Cache model weights ONCE on a shared NFS volume; every new instance/release reuses them — no multi-GB re-download on each launch. vLLM writes to /data/shared-pvc-storage (--download-dir) on the NFS share. Disable to fall back to the per-instance model PVC. Requires TCP 2049 from cluster nodes to the NFS server."
  type: "boolean"
  default: true

- variable: vllm.sharedPvcStorage.nfs.server
  group: "Storage"
  label: "Shared NFS Model Cache — Server"
  description: "NFS server hosting the shared cache, e.g. 10.0.9.10."
  type: "string"
  default: "10.0.9.10"
  show_if: "vllm.sharedPvcStorage.enabled=true"

- variable: vllm.sharedPvcStorage.nfs.path
  group: "Storage"
  label: "Shared NFS Model Cache — Path"
  description: "Directory on the NFS server for the model cache, e.g. /data/ai-models. Dedicated dir; vLLM creates model subdirectories inside it (HF cache layout)."
  type: "string"
  default: "/data/ai-models"
  show_if: "vllm.sharedPvcStorage.enabled=true"

- variable: vllm.sharedPvcStorage.size
  group: "Storage"
  label: "Shared NFS Model Cache — Size"
  description: "PV/PVC capacity for the shared cache. Large enough for ALL models you'll serve: 100Gi per ~35B quantized model, 50Gi per 7B. Default 200Gi."
  type: "string"
  default: "200Gi"
  show_if: "vllm.sharedPvcStorage.enabled=true"

# ===== Router (OpenAI-compatible endpoint) =====
- variable: vllm.routerExposure.type
  group: "Router"
  label: "Router Exposure Type (how Rancher AI reaches it)"
  description: "How the vLLM OpenAI-compatible endpoint (port 80) is exposed. ClusterIP = in-cluster only (default). NodePort = expose on each node's IP, good for bare-metal / Rancher clusters without a load balancer (Rancher AI openaiUrl: http://<node-ip>:<nodePort>/v1). LoadBalancer = external LB IP from cloud providers or MetalLB (openaiUrl: http://<lb-ip>:80/v1). Ingress (below) is the other alternative."
  type: "enum"
  default: "ClusterIP"
  options:
    - "ClusterIP"
    - "NodePort"
    - "LoadBalancer"

- variable: vllm.routerExposure.nodePort
  group: "Router"
  label: "Router NodePort (30000-32767)"
  description: "Fixed NodePort for the vLLM endpoint on every node's IP. Rancher AI openaiUrl becomes http://<node-ip>:<nodePort>/v1. Pick a free port (e.g. 30081) — 30000-32767 only."
  type: "string"
  default: "30081"
  show_if: "vllm.routerExposure.type=NodePort"

- variable: vllm.routerExposure.loadBalancerIP
  group: "Router"
  label: "LoadBalancer IP (optional)"
  description: "Fixed external IP for a LoadBalancer service (e.g. a MetalLB pool address). Leave empty to let the LB auto-assign. Rancher AI openaiUrl becomes http://<lb-ip>:80/v1."
  type: "string"
  default: ""
  show_if: "vllm.routerExposure.type=LoadBalancer"

- variable: vllm.routerSpec.otel.endpoint
  group: "Router"
  label: "OTLP Endpoint (traces)"
  description: "OTLP gRPC endpoint of the shared SUSE Observability collector. Traces only — token metrics come from the Prometheus scrape (vllm_prompt_tokens_total, vllm_generation_tokens_total)."
  type: "string"
  default: "http://open-telemetry-collector-opentelemetry-collector.observability.svc.cluster.local:4317"

# ===== Ingress =====
- variable: vllm.routerSpec.ingress.enabled
  group: "Ingress"
  label: "Enable Ingress (expose to Rancher AI / external clusters)"
  description: "Rancher AI (Liz) runs on the Rancher LOCAL cluster and talks to the LLM over the network — enable this to expose the router endpoint via Ingress. Alternative to the NodePort/LoadBalancer exposure above; pick one. Required when Liz is on a different cluster than this chart."
  type: "boolean"
  default: false

- variable: vllm.routerSpec.ingress.hosts.main.host
  group: "Ingress"
  label: "Ingress Hostname"
  description: "Hostname for the vLLM OpenAI-compatible endpoint, e.g. vllm.wiredquill.com. Rancher AI openaiUrl becomes https://<host>/v1."
  type: "string"
  default: "vllm.wiredquill.com"
  show_if: "vllm.routerSpec.ingress.enabled=true"

- variable: vllm.routerSpec.ingress.className
  group: "Ingress"
  label: "Ingress Class"
  description: "Ingress controller class name."
  type: "string"
  default: "nginx"
  show_if: "vllm.routerSpec.ingress.enabled=true"

# ===== Observability (SUSE Observability Integration) =====
- variable: observability.mode
  group: "Observability"
  label: "Observability Mode"
  description: "<b>existing</b> — send metrics to a shared collector already in the cluster (default, no extra resources). <b>operator</b> — create a dedicated SUSE AI collector in this namespace using the OpenTelemetry Operator (requires OTel Operator to be installed in the cluster). Prometheus metrics from vLLM (/metrics) feed the topology: vllm_prompt_tokens_total, vllm_generation_tokens_total, vllm_time_to_first_token_seconds, vllm_time_per_output_token_seconds."
  type: "enum"
  default: "existing"
  options:
    - "existing"
    - "operator"

- variable: otlpEndpoint
  group: "Observability"
  label: "OTLP Endpoint (shared collector mode)"
  description: "OpenTelemetry collector address where vLLM metrics are sent. Format: http://host:port (no path). <br><br><b>Leave blank to auto-discover:</b> the chart looks up the collector Service in the Collector Namespace below and uses it automatically. This auto-discovery runs at install time and fails the install if the collector cannot be found — so misconfigured collectors are caught immediately instead of silently failing to report metrics. <br><br>Find manually: <code>kubectl get svc -n observability | grep opentelemetry</code>"
  type: "string"
  default: ""
  show_if: "observability.mode=existing"

- variable: observability.collectorNamespace
  group: "Observability"
  label: "Collector Namespace"
  description: "Kubernetes namespace where the shared OpenTelemetry collector Service runs. Used to auto-discover the collector when OTLP Endpoint is blank, and by the pre-install connectivity check. <br><br>Default: <code>observability</code>. If your collector is in <code>suse-observability</code> or another namespace, enter it here — or leave as-is and the chart checks common namespaces (observability, suse-observability)."
  type: "string"
  default: "observability"
  show_if: "observability.mode=existing"

- variable: observability.serviceNamespace
  group: "Observability"
  label: "Service Namespace (SUSE Observability grouping)"
  description: "Namespace tag applied to vLLM components in SUSE Observability, used to group the topology. Defaults to the release namespace. Set to group multiple releases (e.g., all releases in namespace 'ai-stack' group together in the SUSE AI topology)."
  type: "string"
  default: ""

- variable: opentelemetry.operator.suseObservability.apiUrl
  group: "Observability"
  label: "SUSE Observability API URL (operator mode)"
  description: "SUSE Observability API server URL, e.g., https://observability.example.com. <br><br><b>REQUIRED when observability.mode=operator.</b> The collector uses this to export the SUSE AI topology (app → inference engine → model relations)."
  type: "string"
  default: ""
  show_if: "observability.mode=operator"

- variable: opentelemetry.operator.suseObservability.otlpEndpoint
  group: "Observability"
  label: "SUSE Observability OTLP Endpoint (operator mode)"
  description: "OpenTelemetry collector gRPC endpoint hosted by SUSE Observability. Format: host:port (no scheme), e.g., collector.observability.suse.com:4317. <br><br><b>REQUIRED when observability.mode=operator.</b> The chart creates a collector in this namespace and wires it to export here."
  type: "string"
  default: ""
  show_if: "observability.mode=operator"

- variable: opentelemetry.operator.suseObservability.apiKey
  group: "Observability"
  label: "SUSE Observability API Key (operator mode) — OR use existing/copy methods below"
  description: "SUSE Observability API key for exporting the topology. <br><br><b>Choose ONE method:</b><br>1. Paste the key here (Secrets tab shows it obscured).<br>2. Use Existing Secret (existingSecret field) if you already have one in this cluster.<br>3. Leave both empty and enable Auto-Copy Secret (below) — the chart copies it from suse-observability namespace at install time."
  type: "password"
  default: ""
  show_if: "observability.mode=operator"

- variable: opentelemetry.operator.suseObservability.existingSecret
  group: "Observability"
  label: "Existing Secret (operator mode) — leave empty if copying"
  description: "Name of an existing Secret holding the SUSE Observability API key (alternative to pasting it above). The Secret must exist in this namespace and have a data field named API_KEY (or set the field name below). Ignored if left empty; the chart falls back to the API Key field above or auto-copy."
  type: "string"
  default: ""
  show_if: "observability.mode=operator"

- variable: opentelemetry.operator.suseObservability.copySecret.enabled
  group: "Observability"
  label: "Auto-Copy API Key Secret (operator mode) — from suse-observability namespace"
  description: "Enable pre-install hook to copy the SUSE Observability API key from the suse-observability namespace (default) into this release's namespace. Works only when both API Key (above) and Existing Secret are empty. The hook fails loudly if the source secret cannot be found, so wrong secret names are caught immediately."
  type: "boolean"
  default: true
  show_if: "observability.mode=operator"

- variable: opentelemetry.operator.suseObservability.copySecret.sourceNamespace
  group: "Observability"
  label: "Auto-Copy Secret — Source Namespace"
  description: "Namespace holding the SUSE Observability API key secret (default: suse-observability). Change this only if your cluster uses a different namespace for SUSE Observability infrastructure."
  type: "string"
  default: "suse-observability"
  show_if: "observability.mode=operator && opentelemetry.operator.suseObservability.copySecret.enabled=true"

- variable: opentelemetry.operator.suseObservability.copySecret.name
  group: "Observability"
  label: "Auto-Copy Secret — Secret Name"
  description: "Name of the secret in the source namespace to copy (default: suse-observability-api-key). The secret must have a data field named API_KEY."
  type: "string"
  default: "suse-observability-api-key"
  show_if: "observability.mode=operator && opentelemetry.operator.suseObservability.copySecret.enabled=true"
